{% extends "base.html" %}
{% block title %}Add Subject{% endblock %}
{% block content %}
<div class="page-header">
  <div class="page-title">📖 Add Subject</div>
</div>
<div class="card" style="max-width:600px;">
  <form method="POST">
    <div class="form-grid">
      <div class="form-group">
        <label>Subject Code</label>
        <input type="text" name="code" required placeholder="CS301">
      </div>
      <div class="form-group">
        <label>Subject Name</label>
        <input type="text" name="name" required placeholder="Data Structures">
      </div>
      <div class="form-group">
        <label>Department</label>
        <select name="department" required>
          <option value="">Select</option>
          <option>Computer Science</option>
          <option>Electronics</option>
          <option>Mechanical</option>
          <option>Civil</option>
          <option>Information Technology</option>
          <option>Mathematics</option>
          <option>Physics</option>
        </select>
      </div>
      <div class="form-group">
        <label>Semester</label>
        <select name="semester" required>
          {% for i in range(1, 9) %}
          <option value="{{ i }}">Semester {{ i }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Credits</label>
        <input type="number" name="credits" required min="1" max="6" value="4">
      </div>
      <div class="form-group">
        <label>Assign Faculty</label>
        <select name="faculty_id">
          <option value="">— Not Assigned —</option>
          {% for f in faculty_list %}
          <option value="{{ f.id }}">{{ f.user.full_name }} ({{ f.department }})</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div style="display:flex;gap:10px;margin-top:8px;">
      <button type="submit" class="btn btn-primary">✅ Add Subject</button>
      <a href="{{ url_for('admin_subjects') }}" class="btn btn-ghost">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
