{% extends "base.html" %}
{% block title %}Add Student{% endblock %}
{% block content %}
<div class="page-header">
  <div class="page-title">👥 Add New Student</div>
  <div class="page-subtitle">Create a new student profile</div>
</div>
<div class="card" style="max-width:700px;">
  <form method="POST">
    <div class="form-grid">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="full_name" required placeholder="e.g. Arjun Kumar">
      </div>
      <div class="form-group">
        <label>Roll Number</label>
        <input type="text" name="roll_number" required placeholder="e.g. CS2024001">
      </div>
      <div class="form-group">
        <label>Username (Login ID)</label>
        <input type="text" name="username" required placeholder="e.g. arjun2024">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required placeholder="Set login password">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required placeholder="student@college.edu">
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="text" name="phone" placeholder="9876543210">
      </div>
      <div class="form-group">
        <label>Department</label>
        <select name="department" required>
          <option value="">Select Department</option>
          <option>Computer Science</option>
          <option>Electronics</option>
          <option>Mechanical</option>
          <option>Civil</option>
          <option>Information Technology</option>
          <option>Mathematics</option>
          <option>Physics</option>
        </select>
      </div>
      <div class="form-group">
        <label>Semester</label>
        <select name="semester" required>
          {% for i in range(1, 9) %}
          <option value="{{ i }}">Semester {{ i }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Batch Year</label>
        <input type="number" name="batch_year" required placeholder="e.g. 2024" min="2000" max="2030">
      </div>
    </div>
    <div style="display:flex;gap:10px;margin-top:8px;">
      <button type="submit" class="btn btn-primary">✅ Add Student</button>
      <a href="{{ url_for('admin_students') }}" class="btn btn-ghost">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
