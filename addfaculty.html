{% extends "base.html" %}
{% block title %}Add Faculty{% endblock %}
{% block content %}
<div class="page-header">
  <div class="page-title">👨‍🏫 Add Faculty Member</div>
</div>
<div class="card" style="max-width:700px;">
  <form method="POST">
    <div class="form-grid">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="full_name" required placeholder="Dr. Priya Sharma">
      </div>
      <div class="form-group">
        <label>Employee ID</label>
        <input type="text" name="employee_id" required placeholder="FAC001">
      </div>
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required>
      </div>
      <div class="form-group">
        <label>Department</label>
        <select name="department" required>
          <option value="">Select</option>
          <option>Computer Science</option>
          <option>Electronics</option>
          <option>Mechanical</option>
          <option>Civil</option>
          <option>Information Technology</option>
          <option>Mathematics</option>
          <option>Physics</option>
        </select>
      </div>
      <div class="form-group">
        <label>Designation</label>
        <select name="designation">
          <option>Assistant Professor</option>
          <option>Associate Professor</option>
          <option>Professor</option>
          <option>Head of Department</option>
          <option>Lecturer</option>
        </select>
      </div>
    </div>
    <div style="display:flex;gap:10px;margin-top:8px;">
      <button type="submit" class="btn btn-primary">✅ Add Faculty</button>
      <a href="{{ url_for('admin_faculty') }}" class="btn btn-ghost">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
